<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#0c2444"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="swooshTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="swooshBot" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="silverK" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="cyanT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0ea5e9" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded app-icon base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#swooshTop)" stroke-width="6" opacity="0.65"/>

  <!-- Top & bottom signature KlimaTek swooshes -->
  <path d="M72 178 C135 88, 320 68, 438 136 C452 144, 456 164, 434 176 C360 120, 185 122, 92 192 Z" fill="url(#swooshTop)" filter="url(#glow)"/>
  <path d="M440 334 C377 424, 192 444, 74 376 C60 368, 56 348, 78 336 C152 392, 327 390, 420 320 Z" fill="url(#swooshBot)" filter="url(#glow)"/>

  <!-- Stylized italic 3D "K" (Silver) -->
  <path d="M126 170 L176 170 L158 242 L226 170 L282 170 L204 252 L256 342 L202 342 L162 272 L144 342 L94 342 Z"
        fill="url(#silverK)" stroke="#071020" stroke-width="10" stroke-linejoin="round"/>

  <!-- Stylized italic 3D "T" (Cyan-Blue) -->
  <path d="M270 170 L424 170 L414 214 L362 214 L334 342 L284 342 L312 214 L260 214 Z"
        fill="url(#cyanT)" stroke="#071020" stroke-width="10" stroke-linejoin="round"/>

  <!-- Ice glint accent -->
  <circle cx="388" cy="122" r="9" fill="#ffffff" opacity="0.9"/>
  <circle cx="134" cy="390" r="7" fill="#67e8f9" opacity="0.85"/>
</svg>
